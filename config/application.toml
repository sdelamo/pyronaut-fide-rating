#:schema ../__pyronaut__/schemas/micronaut-application.schema.json
# Generated by pyronaut-install for Pyronaut TOML schema support.

liquibase.datasources.default.change-log = 'classpath:db/liquibase-changelog.xml'

[micronaut.application]
name = 'pyronaut-fide-ratings'

[datasources.default]
url = 'jdbc:sqlite:/Users/sdelamo/Documents/sqlite/fide-ratings/fide-ratings.db?foreign_keys=on&busy_timeout=5000&journal_mode=WAL&synchronous=NORMAL'
driver-class-name = 'org.sqlite.JDBC'
dialect = 'SQLITE'

# serves config/public/* at /static/*, for example the style sheet at /static/styles.css
[micronaut.router.static-resources.default]
enabled = true
paths = ['classpath:public']
mapping = '/static/**'

[[micronaut.security.intercept-url-map]]
pattern = '/static/**'
access = ['isAnonymous()']

# OpenAPI documentation: the generated spec at /swagger/fide-ratings-1.0.yml and Swagger UI at /swagger-ui/index.html
[micronaut.router.static-resources.swagger]
paths = ['classpath:META-INF/swagger']
mapping = '/swagger/**'

[micronaut.router.static-resources.swagger-ui]
paths = ['classpath:META-INF/swagger/views/swagger-ui']
mapping = '/swagger-ui/**'

[[micronaut.security.intercept-url-map]]
pattern = '/swagger/**'
access = ['isAnonymous()']

[[micronaut.security.intercept-url-map]]
pattern = '/swagger-ui/**'
access = ['isAnonymous()']
